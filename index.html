<body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-200 selection:text-blue-900">
    
    <!-- Root element for React -->

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Telegram Chat Widget ---
        const TelegramChatWidget = () => {
            const [isOpen, setIsOpen] = useState(false);
            const [message, setMessage] = useState('');
            
            // Change this to your actual Telegram Username
            const telegramUsername = 'kim_san145'; 

            const handleSend = (e) => {
                e.preventDefault();
                if (!message.trim()) return;
                const telegramUrl = `https://t.me/${telegramUsername}?text=${encodeURIComponent(message)}`;
                window.open(telegramUrl, '_blank');
                setMessage('');
                setIsOpen(false);
            };

            return (
                <div className="fixed bottom-6 right-6 z-[100] flex flex-col items-end">
                    {isOpen && (
                        <div className="bg-white rounded-2xl shadow-2xl w-80 mb-4 overflow-hidden border border-slate-200 fade-in origin-bottom-right">
                            <div className="bg-[#0088cc] p-4 text-white flex justify-between items-center">
                                <div className="flex items-center space-x-3">
                                    <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center text-[#0088cc]">
                                        <i className="fa-brands fa-telegram text-2xl"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-sm">Su IT Support</h3>
                                        <p className="text-xs text-blue-100">Fast reply via Telegram</p>
                                    </div>
                                </div>
                                <button onClick={() => setIsOpen(false)} className="text-white hover:text-slate-200 focus:outline-none">
                                    <i className="fa-solid fa-xmark text-xl"></i>
                                </button>
                            </div>
                            <div className="p-4 bg-slate-50 h-48 overflow-y-auto">
                                <div className="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm text-sm text-slate-700 w-[85%] border border-slate-100 leading-relaxed">
                                    Hello! 👋 Do you have any questions about our services? Feel free to message us here...
                                </div>
                            </div>
                            <form onSubmit={handleSend} className="p-3 bg-white border-t border-slate-100 flex items-center space-x-2">
                                <input 
                                    type="text" 
                                    value={message}
                                    onChange={(e) => setMessage(e.target.value)}
                                    placeholder="Type your message..." 
                                    className="flex-grow px-4 py-2 bg-slate-100 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-[#0088cc] focus:bg-white transition-all"
                                    autoFocus
                                />
                                <button 
                                    type="submit"
                                    disabled={!message.trim()}
                                    className="w-10 h-10 bg-[#0088cc] text-white rounded-full flex items-center justify-center hover:bg-blue-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed shrink-0"
                                >
                                    <i className="fa-solid fa-paper-plane"></i>
                                </button>
                            </form>
                        </div>
                    )}

                    <button 
                        onClick={() => setIsOpen(!isOpen)}

                                            <input type="tel" className="w-full px-5 py-3.5 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all" placeholder="e.g. +855 12 345 678" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">Email Address *</label>
                                        <input required type="email" className="w-full px-5 py-3.5 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all" placeholder="john@example.com" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">Service of Interest</label>
                                        <div className="relative">
                                            <select className="w-full px-5 py-3.5 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all appearance-none">
                                                <option>General Inquiry</option>
                                                <option>Web Development</option>
                                                <option>Mobile App Development</option>
                                                <option>Business System (POS/ERP)</option>
                                            </select>
                                            <i className="fa-solid fa-chevron-down absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">Your Message *</label>
                                        <textarea required rows="4" className="w-full px-5 py-3.5 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all resize-none" placeholder="Write your project details here..."></textarea>
                                    </div>
                                    
                                    <button 
                                        disabled={formStatus === 'submitting'}
                                        type="submit" 
                                        className="w-full py-4 px-6 bg-blue-600 text-white font-bold text-lg rounded-xl hover:bg-blue-700 transition-all shadow-[0_0_20px_rgba(37,99,235,0.3)] hover:shadow-[0_0_30px_rgba(37,99,235,0.5)] flex items-center justify-center disabled:opacity-70 disabled:cursor-not-allowed"
                                    >
                                        {formStatus === 'submitting' ? (
                                            <span className="flex items-center"><i className="fa-solid fa-circle-notch fa-spin mr-3"></i> Sending...</span>
                                        ) : (
                                            <React.Fragment>Send Message <i className="fa-solid fa-paper-plane ml-3"></i></React.Fragment>
                                        )}
                                    </button>

                                    {formStatus === 'success' && (
                                        <div className="p-4 bg-green-50 text-green-700 rounded-xl border border-green-200 flex items-center fade-in">
                                            <i className="fa-solid fa-circle-check text-2xl mr-3 text-green-500"></i>
                                            <div>
                                                <h4 className="font-bold">Success!</h4>
                                                <p className="text-sm">Your message has been sent. We will get back to you shortly.</p>
                                            </div>
                                        </div>
                                    )}
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('home');

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    <Navbar activeTab={activeTab} setActiveTab={setActiveTab} />
                    <main className="flex-grow w-full overflow-x-hidden">
                        {activeTab === 'home' && <Home setActiveTab={setActiveTab} />}
                        {activeTab === 'personal' && <Personal />}
                        {activeTab === 'business' && <Business />}
                        {activeTab === 'contact' && <Contact />}
                    </main>
                    <Footer />
                    <TelegramChatWidget />
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
